name: Custom Chat Workshop

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - 'addon.json'
      - 'lua/**'
      - 'materials/**'
      - 'resource/**'
      - 'data_static/**'
      - '.github/workflows/publish-workshop.yml'
  workflow_dispatch:
    inputs:
      create_new:
        description: Criar o primeiro item do addon no Workshop
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workshop-custom-chat-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Conferir arquivos do pacote
        shell: bash
        run: |
          set -euo pipefail
          test -f addon.json
          test -d lua
          test -d materials
          test -d resource
          if find . -path './.git' -prune -o -type l -print | grep .; then exit 1; fi

      - name: Validar GMA sem enviar à Steam
        uses: linventif/gmod-workshop-cicd@923dae0a327040b2f01cf6876cbecbbb97462bdf
        with:
          steam_user: ''
          steam_pass: ''
          content_path: .
          preview_file: workshop-preview.png
          title: Custom Chat
          description: Chat personalizado para o servidor Sherlock HnS.
          dry_run: 'true'

      - name: Validar destino da publicação
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (vars.WORKSHOP_ID != '' || '2799307109' != ''))
        env:
          ITEM: ${{ vars.WORKSHOP_ID || '2799307109' }}
          CREATE: ${{ inputs.create_new }}
        run: |
          set -eu
          if [ "$CREATE" = true ]; then
            test -z "${{ vars.WORKSHOP_ID }}" || { echo 'WORKSHOP_ID já configurado'; exit 1; }
          else
            [[ "$ITEM" =~ ^[1-9][0-9]*$ ]] || { echo 'Configure WORKSHOP_ID ou use create_new'; exit 1; }
          fi

      - name: Publicar Custom Chat
        id: publish
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (vars.WORKSHOP_ID != '' || '2799307109' != ''))
        uses: linventif/gmod-workshop-cicd@923dae0a327040b2f01cf6876cbecbbb97462bdf
        with:
          steam_user: ${{ secrets.STEAM_USER }}
          steam_pass: ${{ secrets.STEAM_PASS }}
          steam_shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}
          published_file_id: ${{ inputs.create_new && '0' || (vars.WORKSHOP_ID || '2799307109') }}
          content_path: .
          title: Custom Chat
          description: Chat personalizado para o servidor Sherlock HnS.
          visibility: '0'
          change_note: Atualização do addon Custom Chat

      - name: Registrar ID da Workshop
        if: steps.publish.outcome == 'success'
        env:
          ITEM: ${{ steps.publish.outputs.published_file_id }}
        run: echo "Workshop ID do Custom Chat = $ITEM" >> "$GITHUB_STEP_SUMMARY"
